# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - 'v*'   # Triggers on tags like v1.0.0, v2.3.4, etc.

permissions:
  contents: write  # Needed to create releases and upload artifacts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Needed for changelog and proper versioning

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies (CGO)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev   # Required for CGO tree-sitter

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Automatically provided by GitHub
