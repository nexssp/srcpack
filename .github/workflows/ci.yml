name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-release-config:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.3
          args: check

  build-release-targets:
    needs: validate-release-config
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux/amd64
            runner: ubuntu-22.04
            goos: linux
            goarch: amd64
            cc: gcc
            binary: srcpack
          - target: linux/arm64
            runner: ubuntu-22.04-arm
            goos: linux
            goarch: arm64
            cc: gcc
            binary: srcpack
          - target: windows/amd64
            runner: ubuntu-22.04
            goos: windows
            goarch: amd64
            cc: x86_64-w64-mingw32-gcc
            binary: srcpack.exe
          - target: darwin/amd64
            runner: macos-26-intel
            goos: darwin
            goarch: amd64
            cc: clang
            binary: srcpack
          - target: darwin/arm64
            runner: macos-26
            goos: darwin
            goarch: arm64
            cc: clang
            binary: srcpack
    runs-on: ${{ matrix.runner }}
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '1'
      CC: ${{ matrix.cc }}
      BINARY: ${{ matrix.binary }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Windows CGO cross-compiler
        if: matrix.goos == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Prepare build directory
        run: mkdir -p build
      - name: Build target with GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.3
          args: build --clean --snapshot --single-target --output build/${{ matrix.binary }}
      - name: Verify target binary
        shell: bash
        run: |
          test -s "build/${BINARY}"
          go version -m "build/${BINARY}" > build-info.txt
          grep -F "$(printf '\tbuild\tGOOS=%s' "$GOOS")" build-info.txt
          grep -F "$(printf '\tbuild\tGOARCH=%s' "$GOARCH")" build-info.txt
          grep -F $'\tbuild\tCGO_ENABLED=1' build-info.txt

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Formatting
        run: test -z "$(gofmt -l .)"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-only: true

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

      - name: Run Unit Tests
        run: go test ./...

      - name: Run Tests with Race Detector
        run: go test -race ./...

      - name: Run Benchmarks
        run: go test -run='^$' -bench=. -benchmem ./...
