default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint (fix, new code only)
        entry: task lint:fix
        language: system
        pass_filenames: false
        types: [go]
        stages: [pre-commit]

      - id: nflow-quality
        name: NFlow lint and formatting check
        entry: task nflow:quality
        language: system
        pass_filenames: false
        files: '\.nflow$'
        stages: [pre-commit]

      - id: go-test
        name: go test (short, cached per tree)
        entry: task test
        language: system
        pass_filenames: false
        types: [go]
        stages: [pre-commit]

      - id: pre-push
        name: pre-push (lint new code + short tests)
        entry: task pre-push
        language: system
        pass_filenames: false
        types: [go]
        stages: [pre-push]
