# Install Task: go install github.com/go-task/task/v3/cmd/task@latest
version: '3'

vars:
  SRCPACK: 'go run ./cmd/srcpack'
  NFLOW: 'nflow'
  BASE:
    sh: git merge-base HEAD origin/main 2>/dev/null || echo HEAD
  CENTRAL_REF: 'main'
  GOTEST: '{{.GOTEST | default "go test"}}'

tasks:
  default: { cmds: [task --list --sort none], silent: true }

  build:     { desc: 'go build [./...]',                       cmds: ['go build {{.CLI_ARGS | default "./..."}}'] }
  build:bin: { desc: 'go build -trimpath -o bin/ ./cmd/...', cmds: [go build -trimpath -o bin/ ./cmd/...] }
  tidy:      { desc: 'go mod tidy',                          cmds: [go mod tidy] }
  clean:     { desc: 'rm -rf bin coverage.out _srcpack',     cmds: [rm -rf bin coverage.out _srcpack] }

  # ── Tests ────────────────────────────────────────────────────────

  test:              { desc: '{{.GOTEST}} -short [./...]',                     cmds: ['{{.GOTEST}} -short {{.CLI_ARGS | default "./..."}}'] }
  test:nocache:      { desc: '{{.GOTEST}} -count=1 [./...]',                   cmds: ['{{.GOTEST}} -count=1 {{.CLI_ARGS | default "./..."}}'] }
  test:race:         { desc: '{{.GOTEST}} -race -short [./...]',               cmds: ['{{.GOTEST}} -race -short {{.CLI_ARGS | default "./..."}}'] }
  test:race:nocache: { desc: '{{.GOTEST}} -race -count=1 [./...]',             cmds: ['{{.GOTEST}} -race -count=1 {{.CLI_ARGS | default "./..."}}'] }
  test:cover:        { desc: '{{.GOTEST}} -coverprofile=coverage.out [./...]', cmds: ['{{.GOTEST}} -coverprofile=coverage.out -short {{.CLI_ARGS | default "./..."}}', go tool cover -func=coverage.out] }
  bench:             { desc: '{{.GOTEST}} -run=^$ -bench=. -benchmem [./...]', cmds: ['{{.GOTEST}} -run=^$ -bench=. -benchmem {{.CLI_ARGS | default "./..."}}'] }

  # ── Runner & srcpack commands ────────────────────────────────────

  run:    { desc: 'Run srcpack: task run -- arch', cmds: ['{{.SRCPACK}} {{.CLI_ARGS}}'] }
  demo:   { desc: 'Run the built-in AST demo',        cmds: ['{{.SRCPACK}} demo'] }
  doctor: { desc: 'Validate nexss.srcpack.yml',       cmds: ['{{.SRCPACK}} doctor'] }

  # ── Quality & Linting ────────────────────────────────────────────

  # report.nflow is an embedded pipeline fragment, not a standalone Flow file.
  nflow:fmt:
    desc: Format standalone NFlow sources with upstream Flow
    cmds:
      - find . -type f -name '*.nflow' -not -path './.git/*' -not -path './vendor/*' -not -path './node_modules/*' -not -path './examples/flow-fold/report.nflow' -print0 | xargs -0 {{.NFLOW}} fmt --write

  nflow:fmt-check:
    desc: Check standalone NFlow formatting with upstream Flow (read-only)
    cmds:
      - find . -type f -name '*.nflow' -not -path './.git/*' -not -path './vendor/*' -not -path './node_modules/*' -not -path './examples/flow-fold/report.nflow' -print0 | xargs -0 {{.NFLOW}} fmt --check

  lint:nflow:
    desc: Lint production NFlow sources with upstream Flow
    cmds: ['{{.NFLOW}} lint {{.CLI_ARGS | default "./bundles ./nflows ./nexssflow"}}']

  nflow:quality: { desc: '[lint:nflow, nflow:fmt-check]', deps: [lint:nflow, nflow:fmt-check] }
  fmt:           { desc: 'Format Go and NFlow sources', deps: [nflow:fmt], cmds: [golangci-lint fmt] }
  lint:          { desc: 'golangci-lint run [./...]', cmds: ['golangci-lint run {{.CLI_ARGS | default "./..."}}'] }
  lint:new:      { desc: 'golangci-lint run --new-from-rev="BASE" [./...]', cmds: ['golangci-lint run --new-from-rev="{{.BASE}}" {{.CLI_ARGS | default "./..."}}'] }
  lint:fix:      { desc: 'golangci-lint run --fix --new-from-rev="BASE" [./...]', cmds: ['golangci-lint run --fix --new-from-rev="{{.BASE}}" {{.CLI_ARGS | default "./..."}}'] }
  vuln:          { desc: 'govulncheck -show=version [./...]', cmds: ['govulncheck -show=version {{.CLI_ARGS | default "./..."}}'] }

  # ── Workflows (Gates) ────────────────────────────────────────────

  pre-commit: { desc: '[doctor, lint, nflow:quality, test]', deps: [doctor, lint, nflow:quality, test] }
  pre-push:   { desc: '[doctor, lint, nflow:quality, test:race]', deps: [doctor, lint, nflow:quality, test:race] }
  ci:
    desc: '[doctor, lint, nflow:quality, test:race:nocache] (parallel + failfast)'
    deps: [doctor, lint, nflow:quality, test:race:nocache]
    output: prefixed

  # ── Setup & Tooling ──────────────────────────────────────────────

  tools: { desc: 'go install -> gotest.tools/gotestsum@latest golang.org/x/vuln/cmd/govulncheck@latest', cmds: ['go install gotest.tools/gotestsum@latest', 'go install golang.org/x/vuln/cmd/govulncheck@latest'] }

  setup: { desc: '[setup:files, tools]', deps: [setup:files, tools] }

  setup:files:
    desc: 'Fetch missing repo templates (LICENSE, .gitignore, configs...)'
    cmds:
      - |
        for f in LICENSE NOTICE .gitattributes .gitignore .golangci.yml .pre-commit-config.yaml; do
          test -f "$f" || { echo "→ Fetching $f..."; curl -sSfL "https://raw.githubusercontent.com/nexssp/.github/{{.CENTRAL_REF}}/$f" -o "$f"; }
        done
